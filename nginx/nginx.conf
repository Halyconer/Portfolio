# nginx/nginx.conf — reverse proxy config for the portfolio Pi stack.
#
# Topology (everything on host networking, so all "localhost" refs work):
#
#   browser (adrianeddy.com page) ──► ngrok static URL
#                                       │
#                                       ▼
#                         Pi host:8080 (this nginx container)
#                          │
#               ┌──────────┴──────────┐
#               ▼                     ▼
#       Pi host:5001              Pi host:5002
#       (portfolio /              (connectx /
#        lighting Flask)          Connect4 Flask)
#
# Why nginx at all? Three reasons:
#   1. One public URL routed to two Flask apps via path prefix.
#   2. Single place to handle CORS, so the Flask apps don't have to.
#   3. Cheap headroom for adding TLS, rate limiting, caching later.

# nginx is multi-process; for a Pi with a couple of Flask backends, one worker
# is plenty. Each worker can handle thousands of concurrent connections.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # ── Origin allowlist ─────────────────────────────────────────────────────
    # `map` is a lookup: it evaluates $http_origin (the browser's Origin header)
    # against the entries below and sets $cors_origin accordingly.
    #
    # If the request's Origin matches a known frontend, $cors_origin gets set to
    # that origin and we echo it back in Access-Control-Allow-Origin.
    # If it doesn't match, $cors_origin stays empty and no CORS header is sent,
    # which causes the browser to block the response — the correct behavior for
    # untrusted origins.
    map $http_origin $cors_origin {
        default                          "";
        "https://adrianeddy.com"         $http_origin;
        "https://www.adrianeddy.com"     $http_origin;
        "http://localhost:3000"          $http_origin;   # local React dev
        "http://localhost:5173"          $http_origin;   # Vite default
    }

    # Compact access log — useful for spotting which routes get traffic and
    # what origins are calling. Goes to the nginx container's stdout by default
    # (Docker captures it), so `docker logs nginx` shows recent requests.
    log_format compact '$remote_addr "$request" $status $body_bytes_sent origin="$http_origin"';
    access_log /var/log/nginx/access.log compact;
    error_log  /var/log/nginx/error.log warn;

    # Tell upstream Flask apps about the original scheme/host so they can build
    # correct absolute URLs (e.g. for redirects, links in JSON).
    server {
        listen 8080;
        server_name _;            # accept any Host header — ngrok rewrites it

        # ── Health endpoint for diagnostics ──────────────────────────────────
        # `curl http://localhost:8080/health` from the Pi should print "ok".
        # Useful for checking nginx is alive without depending on either Flask
        # app being up.
        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── /lighting/* → http://localhost:5001/* ────────────────────────────
        #
        # KEY DETAIL: the trailing slash on proxy_pass.
        #   `proxy_pass http://localhost:5001/;`  (with /)
        #     /lighting/set_brightness  →  /set_brightness
        #   `proxy_pass http://localhost:5001;`   (no /)
        #     /lighting/set_brightness  →  /lighting/set_brightness
        # Your Flask routes are bare (@app.route('/set_brightness')), so we
        # need the slash form to strip the /lighting/ prefix before proxying.
        location /lighting/ {
            # CORS preflight (OPTIONS) — answer it here, don't forward to Flask.
            # Browsers send OPTIONS before any non-simple POST to check CORS.
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, ngrok-skip-browser-warning' always;
                add_header 'Access-Control-Max-Age'       86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            # CORS headers on the real (non-OPTIONS) response.
            # `always` makes nginx add the header even on error responses (4xx/5xx),
            # which is important — browsers need CORS on errors too, otherwise
            # JS just sees a generic network failure.
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://localhost:5001/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── /connect4/* → http://localhost:5002/* ────────────────────────────
        # Same pattern as /lighting/ above. Frontend hits /connect4/play, nginx
        # strips the prefix, Flask sees /play and routes to its @app.route('/play').
        location /connect4/ {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, ngrok-skip-browser-warning' always;
                add_header 'Access-Control-Max-Age'       86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://localhost:5002/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Generated stats JSON → http://localhost:5001 (same path) ─────────
        # The portfolio Flask app serves pre-generated JSON files at bare paths
        # (@app.route('/reading.json') etc.), so unlike /lighting/ there is no
        # prefix to strip. `location ~ ^/...$` is a regex match, and with regex
        # locations proxy_pass must NOT include a URI part — nginx forwards the
        # original path unchanged, which is exactly what we want here.
        #
        # These are simple GETs, so browsers skip the OPTIONS preflight — but
        # the response still needs Access-Control-Allow-Origin or the frontend
        # JS can't read it (the page origin adrianeddy.com differs from
        # api.adrianeddy.com, which makes this a cross-origin request).
        location ~ ^/(reading|stats|spotify_stats)\.json$ {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;

            proxy_pass http://localhost:5001;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
